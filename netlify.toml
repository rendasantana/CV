# Next.js 16 on Netlify (OpenNext adapter).
# Plugin is listed explicitly so Git-linked CI builds get the same runtime as
# `netlify deploy --build --prod` (auto-inject alone was publishing .next with
# no server handler → production 404).
# Docs: https://docs.netlify.com/build/frameworks/framework-setup-guides/nextjs/overview/

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Custom domain: apex is primary; www redirects to apex.
# Domain attached on site "rendasantana"; Netlify DNS zone holds NETLIFY records.
[[redirects]]
  from = "https://www.rendasantana.my.id/*"
  to = "https://rendasantana.my.id/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.rendasantana.my.id/*"
  to = "https://rendasantana.my.id/:splat"
  status = 301
  force = true
